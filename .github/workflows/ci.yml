name: CI

# 누가 어떤 도구로 push하든 서버에서 돌아간다.
# 로컬에 Node를 깔지 않아도, GitHub 웹으로 CSV를 편집해도 검증이 걸린다.

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

jobs:
  progress:
    name: 작업 기록 갱신
    runs-on: ubuntu-latest
    # 봇 자신의 커밋으로 다시 도는 것을 막는다.
    # main 전용 — develop 개발 중에 봇 커밋이 끼면 매번 pull 충돌이 난다.
    # 작업 기록은 develop → main 병합 시점에 한 번에 갱신된다.
    if: >-
      github.actor != 'github-actions[bot]'
      && github.event_name == 'push'
      && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          # progress.mjs 는 전체 커밋 이력을 읽는다. 얕은 클론이면 일부만 나온다.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: PROGRESS.md 생성
        run: node tools/progress.mjs

      - name: 변경됐으면 커밋
        run: |
          if git diff --quiet docs/progress/PROGRESS.md; then
            echo "변경 없음"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/progress/PROGRESS.md
          git commit -m "[Docs] PROGRESS.md 갱신 [skip ci]"
          git push

  check:
    name: 검증
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 의존성 설치
        run: npm install --no-audit --no-fund

      - name: 콘텐츠 CSV 검증
        run: npm run data:validate

      - name: 기획 문서 구조 검수
        run: npm run docs:check

      - name: 단위 테스트
        run: npm test
